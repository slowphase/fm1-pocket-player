# FM-1 Pocket Player: nightly sync, checks and publishing.
#
# Every day at 06:23 UTC (4:23 pm in Queensland, after RemoteFM1FW's own 03:20 sync and 04:17 deploy),
# when run by hand from the Actions tab ("Run workflow"), and when the site's code changes on main.
#
# 1. Approvals: `pocket-review` issues labelled `approved` go onto pocket/policy.json.
# 2. Sync: compare RemoteFM1FW's release with what was published, test anything new or changed, and
#    build the site's data folder (pocket/sync.mjs).
# 3. Keep the approved files in this repository's rolling release `pocket-current` (the durable copy;
#    the Actions cache only saves downloads).
# 4. Publish to GitHub Pages, only when something changed (or the code did). A failed step publishes
#    nothing, so the working site stays up.
# 5. Open, update or close the review and failure issues, and run the missing-firmware radar against
#    The Firmware Hub (their own job: they never block publishing).
# 6. The expanded catalogue, catalog-v2.json (pocket/discover.mjs): everything discovered, with each player's
#    compatibility. Built every night; published on the site only when the repository variable
#    POCKET_PUBLISH_V2 is "true". catalog.json is unchanged either way.
#    - The Firmware Hub's catalogue is read at most once a day (pocket/hub.mjs keeps a copy in pocket-current).
#    - Compatibility (pocket/compat.mjs): every published build in the web runtime and in the Mac app's native
#      engine built for Linux; the native-macos job then runs a representative set on macOS, which the next
#      night's catalogue uses to mark native results verified.
# 7. The emulator engine (pocket/emu/): the makers' original .fwsc packages, run unchanged in upstream fm1-emu
#    (pinned in pocket/emu/upstream.json). The emu job fetches new packages from the makers' releases (SHA-256 checked
#    against the Hub's list), measures them on Linux and in the browser engine, and keeps packages, ledger and the web
#    engine in this repository's rolling release `pocket-packages`; emu-macos measures them on macOS. The sync job adds
#    each firmware's `emu` block to catalog-v2.json and puts the hostable packages under data/pkg/ and the browser
#    engine under emu/, only when the repository variable POCKET_PUBLISH_EMU is "true" (and v2 is published).
#    Otherwise it is built for review only (the catalog-v2-emu-preview artifact). catalog.json never changes.
name: Pocket sync

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pocket-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write     # policy.json approvals, the heartbeat, the pocket-current release
      issues: write       # review and failure issues
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Tests
        run: node --test pocket/tests/*.test.mjs

      - name: Hosting and final archive guards
        run: python3 -B pocket/test_hosting_guard.py

      - name: Approvals from issues
        run: node pocket/review.mjs approvals

      - name: Commit approvals, and keep the schedule alive
        # GitHub turns scheduled workflows off after 60 days without activity in a public repository.
        # If the last commit is older than 45 days, a one-line heartbeat file is committed.
        run: |
          git config user.name "pocket-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > pocket/heartbeat.txt
          fi
          git add pocket/policy.json pocket/heartbeat.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Pocket sync: approvals and heartbeat"
            git push
          fi

      - name: Restore downloaded firmware
        uses: actions/cache/restore@v6
        with:
          path: pocket-store
          key: pocket-store-${{ github.run_id }}
          restore-keys: pocket-store-

      - name: Sync with RemoteFM1FW
        run: node pocket/sync.mjs --out _site/data --store pocket-store

      - name: The Firmware Hub's catalogue (read at most once a day)
        id: hub
        run: |
          gh release download pocket-current -p hub-catalog.json -O pocket-store/hub-catalog.release.json --clobber 2>/dev/null || true
          # A rejected archive publishes no state. Keep a fresher Actions-cache
          # copy rather than overwriting it and re-reading the Hub on a retry.
          python3 - <<'PY_CACHE'
          import json, pathlib, shutil
          choices=[]
          for name in ("pocket-store/hub-catalog.json", "pocket-store/hub-catalog.release.json"):
              try:
                  value=json.loads(pathlib.Path(name).read_text())
                  if value.get("fetchedAt"): choices.append((value["fetchedAt"],name))
              except (OSError,ValueError): pass
          if choices:
              chosen=max(choices)[1]
              if chosen != "pocket-store/hub-catalog.json": shutil.copyfile(chosen,"pocket-store/hub-catalog.json")
          PY_CACHE
          node pocket/hub.mjs --cache pocket-store/hub-catalog.json

      - name: Which native engine to test
        id: native
        run: |
          echo "repository=$(node -p "require('./pocket/native.json').repository")" >> "$GITHUB_OUTPUT"
          echo "commit=$(node -p "require('./pocket/native.json').commit")" >> "$GITHUB_OUTPUT"

      - name: Check out the native engine (the Mac app's C core)
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.native.outputs.repository }}
          ref: ${{ steps.native.outputs.commit }}
          path: native-engine

      - name: Build the native engine's boot test (Linux)
        run: make -C native-engine/Tests/ctest native_smoke

      - name: Compatibility (web runtime and native engine)
        id: compat
        run: |
          gh release download pocket-current -p compat.json -O pocket-store/compat.json --clobber 2>/dev/null || true
          gh release download pocket-current -p native-macos.json -O pocket-store/native-macos.json --clobber 2>/dev/null || true
          node pocket/compat.mjs --data _site/data --ledger pocket-store/compat.json \
            --native native-engine/Tests/ctest/native_smoke --macos-results pocket-store/native-macos.json

      - name: Catalogue v2
        id: v2
        run: |
          gh release download pocket-current -p catalog-v2.json -O pocket-store/catalog-v2.previous.json --clobber 2>/dev/null || true
          # release dates for the few firmwares the Hub does not list (the makers' GitHub releases; the rest come from the Hub)
          node pocket/releases.mjs --catalogue pocket-store/catalog-v2.previous.json --hub pocket-store/hub-catalog.json \
            --upstream pocket-upstream.json --out releases.json || echo "{}" > releases.json
          node pocket/discover.mjs --data _site/data --upstream pocket-upstream.json --report pocket-report.json \
            --ledger pocket-store/compat.json --hub pocket-store/hub-catalog.json --previous pocket-store/catalog-v2.previous.json \
            --releases releases.json
          cp _site/data/catalog-v2.json pocket-store/catalog-v2.json
          if [ "${{ vars.POCKET_PUBLISH_V2 }}" != "true" ]; then
            mv _site/data/catalog-v2.json catalog-v2.unpublished.json
            echo "catalog-v2.json was built but not added to the site (POCKET_PUBLISH_V2 is not \"true\")." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: The emulator engine (original packages)
        id: emu
        run: |
          mkdir -p emu-state emu-store
          gh release download pocket-packages -p packages.json -p emu-compat.json -D emu-state --clobber 2>/dev/null || true
          if [ ! -s emu-state/packages.json ]; then
            echo "No pocket-packages release yet: the emulator engine is left out tonight." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          commit=$(python3 -c "import json;print(json.load(open('pocket/emu/upstream.json'))['commit'][:12])")
          flags=""
          if gh release download pocket-packages -p "fm1-emu-web-$commit.tar.gz" -D emu-state --clobber 2>/dev/null; then
            mkdir -p emu-web && tar -xzf "emu-state/fm1-emu-web-$commit.tar.gz" -C emu-web
          else
            flags="--no-web-engine"; echo "No browser engine built for fm1-emu@$commit yet." >> "$GITHUB_STEP_SUMMARY"
          fi
          gh release download pocket-packages -p '*.fwsc' -p 'shot-*.png' -D emu-store --skip-existing 2>/dev/null || true
          python3 -B pocket/hosting_restore.py --previous pocket-store/catalog-v2.previous.json --store emu-store
          publish=false
          [ "${{ vars.POCKET_PUBLISH_V2 }}" = "true" ] && [ "${{ vars.POCKET_PUBLISH_EMU }}" = "true" ] && [ -f _site/data/catalog-v2.json ] && publish=true
          if [ "$publish" = "true" ]; then
            python3 pocket/emu/catalog.py --v2 _site/data/catalog-v2.json --packages emu-state/packages.json --emu-ledger emu-state/emu-compat.json \
              --rfm1-ledger pocket-store/compat.json --store emu-store --site _site/data --hosting-guard --previous pocket-store/catalog-v2.previous.json $flags
            [ -d emu-web ] && mkdir -p _site/emu && cp emu-web/* _site/emu/
            cp _site/data/catalog-v2.json pocket-store/catalog-v2.json
            old=$(python3 -c "import json;print(json.dumps([e.get('emu') for e in json.load(open('pocket-store/catalog-v2.previous.json'))['firmwares']],sort_keys=True))" 2>/dev/null | sha256sum)
            new=$(python3 -c "import json;print(json.dumps([e.get('emu') for e in json.load(open('_site/data/catalog-v2.json'))['firmwares']],sort_keys=True))" | sha256sum)
            # (an if, not "&&": an unchanged catalogue must not end the step with a failure)
            if [ "$old" != "$new" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          else
            cp pocket-store/catalog-v2.json catalog-v2.emu-preview.json
            python3 pocket/emu/catalog.py --v2 catalog-v2.emu-preview.json --packages emu-state/packages.json --emu-ledger emu-state/emu-compat.json \
              --rfm1-ledger pocket-store/compat.json --store emu-store --hosting-guard --previous pocket-store/catalog-v2.previous.json $flags
            echo "The emulator engine was built for review, not published (POCKET_PUBLISH_EMU is not \"true\")." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep catalog-v2.json for review
        uses: actions/upload-artifact@v7
        with:
          name: catalog-v2
          path: |
            _site/data/catalog-v2.json
            catalog-v2.unpublished.json
            catalog-v2.emu-preview.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Save downloaded firmware
        if: always()
        uses: actions/cache/save@v6
        with:
          path: pocket-store
          key: pocket-store-${{ github.run_id }}

      - name: Decide whether to publish
        id: decide
        run: |
          changed=$(node -p "require('./pocket-report.json').changed")
          v2changed="${{ steps.v2.outputs.changed }}"
          [ "${{ steps.emu.outputs.changed }}" = "true" ] && v2changed=true
          [ "${{ vars.POCKET_PUBLISH_V2 }}" = "true" ] || v2changed=false
          if [ "$changed" = "true" ] || [ "$v2changed" = "true" ] || [ "${{ github.event_name }}" != "schedule" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
          echo "library changed: $changed; catalogue v2 changed (and published): $v2changed"

      - name: Assemble the site
        run: |
          cp -r index.html src firmware LICENSE _site/
          mkdir -p _site/docs/img
          cp docs/img/og.png _site/docs/img/ 2>/dev/null || true
          touch _site/.nojekyll
          du -sh _site

      - name: Check the finished publication ZIP and Pages TAR
        id: site_guard
        run: |
          python3 -B pocket/hosting_stage.py --source _site --zip publication.zip
          python3 -B pocket/hosting_guard.py publication.zip --rfm-catalogue _site/data/catalog.json --complete-site --extract-to verified-site --report publication-delivery-check.json
          tar -cf artifact.tar -C verified-site .
          python3 -B pocket/hosting_guard.py artifact.tar --rfm-catalogue _site/data/catalog.json --complete-site --report pages-delivery-check.json
          echo "passed=true" >> "$GITHUB_OUTPUT"

      - name: Check the finished pocket-current upload ZIP
        id: current_guard
        if: success() && steps.site_guard.outputs.passed == 'true'
        run: |
          node -e "for (const f of require('./pocket-report.json').upload) console.log(f)" > upload.txt
          [ "${{ vars.POCKET_PUBLISH_V2 }}" = "true" ] && echo pocket-store/catalog-v2.json >> upload.txt
          python3 -B pocket/hosting_stage.py --files upload.txt --stage current-upload --zip pocket-current-upload.zip
          python3 -B pocket/hosting_guard.py pocket-current-upload.zip --rfm-catalogue _site/data/catalog.json --extract-to verified-current --report current-delivery-check.json
          echo "passed=true" >> "$GITHUB_OUTPUT"

      - name: Keep the Hub copy and the compatibility ledger
        # in the release whether or not the site is published, so the Hub is not re-read and builds are not
        # re-tested every night
        if: success() && steps.site_guard.outputs.passed == 'true' && steps.current_guard.outputs.passed == 'true'
        run: |
          files="pocket-store/compat.json"
          # the Hub copy too whenever there is one (fetched today or reused): the radar and pull-request checks
          # read it from the release, and uploading a copy is not a read of the Hub
          [ -s pocket-store/hub-catalog.json ] && files="$files pocket-store/hub-catalog.json"
          gh release view pocket-current >/dev/null 2>&1 && gh release upload pocket-current $files --clobber || echo "no pocket-current release yet"

      - name: Update the pocket-current release
        if: success() && steps.current_guard.outputs.passed == 'true' && steps.decide.outputs.deploy == 'true'
        run: |
          gh release view pocket-current >/dev/null
          files=(verified-current/*)
          if [ -f "${files[0]}" ]; then gh release upload pocket-current "${files[@]}" --clobber; fi
          node -e "for (const f of require('./pocket-report.json').remove) console.log(f)" | while read -r name; do
            gh release delete-asset pocket-current "$name" -y || true
          done

      - name: Upload the checked Pages archive
        if: success() && steps.site_guard.outputs.passed == 'true' && steps.current_guard.outputs.passed == 'true' && steps.decide.outputs.deploy == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Keep the report for the issues job
        if: always() && hashFiles('pocket-report.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: pocket-report
          path: pocket-report.json
          retention-days: 7

  # Review requests and failure reports. A separate job, so a problem here never stops the site
  # from publishing.
  issues:
    needs: sync
    if: always() && needs.sync.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write     # the radar's baseline, kept in the pocket-current release
      issues: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: pocket-report
        continue-on-error: true
      - name: Review and failure issues
        run: node pocket/review.mjs report

      - name: Missing-firmware radar
        # Compares The Firmware Hub with the browser builds; never downloads a .fwsc or builds anything.
        run: node pocket/radar.mjs

  # The native engine on macOS (Apple Silicon), for pocket/native.json's representative set. Runs after the sync and
  # never blocks publishing; the next night's catalogue uses its result (native-macos.json in pocket-current).
  native-macos:
    needs: sync
    if: always() && needs.sync.result == 'success'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write     # native-macos.json in the pocket-current release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Which native engine to test
        id: native
        run: |
          echo "repository=$(node -p "require('./pocket/native.json').repository")" >> "$GITHUB_OUTPUT"
          echo "commit=$(node -p "require('./pocket/native.json').commit")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.native.outputs.repository }}
          ref: ${{ steps.native.outputs.commit }}
          path: native-engine
      - name: Build the native engine's boot test (macOS)
        run: make -C native-engine/Tests/ctest native_smoke
      - name: Fetch the firmware to run on macOS (representative set, plus builds slow or borderline on Linux)
        run: |
          mkdir -p rep/fw
          gh release download pocket-current -p catalog.json -D rep --clobber
          gh release download pocket-current -p compat.json -D rep --clobber ||
            echo "::warning::No compatibility ledger in pocket-current: macOS runs the representative set only, so slow builds are not timed on macOS this time."
          node pocket/compat.mjs --macos-list --data rep --ledger rep/compat.json | sed 's#^fw/##' |
            while read -r f; do gh release download pocket-current -p "$f" -D rep/fw --clobber; done
      - name: Run them in the native engine on macOS
        run: |
          node pocket/compat.mjs --macos --data rep --ledger rep/compat.json --native native-engine/Tests/ctest/native_smoke --out native-macos.json | tee -a "$GITHUB_STEP_SUMMARY"
          gh release upload pocket-current native-macos.json --clobber

  # The emulator engine's packages and measurements, for the next night's catalogue. Never blocks publishing.
  emu:
    needs: sync
    if: always() && needs.sync.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write     # the pocket-packages release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Saved state
        run: |
          mkdir -p state saved
          gh release download pocket-packages -p packages.json -p emu-compat.json -D state --clobber 2>/dev/null || true
          for a in hub-catalog.json catalog-v2.json compat.json; do gh release download pocket-current -p "$a" -D saved --clobber; done
          # first run: start the ledger from the evaluation's measurements (same engine commit, same packages by SHA-256)
          [ -s state/emu-compat.json ] || python3 pocket/emu/ledger.py seed --ledger state/emu-compat.json --from docs/emu-evaluation-results.json
      - name: Restore fetched packages
        uses: actions/cache/restore@v6
        with:
          path: pkgs
          key: emu-pkgs-${{ github.run_id }}
          restore-keys: emu-pkgs-
      - name: New or changed packages, from the makers' releases (SHA-256 checked)
        run: |
          node pocket/emu/packages.mjs --hub saved/hub-catalog.json --out pkgs --previous state/packages.json
          cp pkgs/packages.json state/packages.json
      - name: Restore accepted originals while new hosting is pending
        run: python3 -B pocket/hosting_restore.py --previous saved/catalog-v2.json --store pkgs
      - name: What Pocket may host
        # only the packages Pocket may host (an open licence, not excluded by policy.json), as hosted/pkg/<hub>-<sha8>.fwsc
        run: |
          cp saved/catalog-v2.json hostable.json
          python3 pocket/emu/catalog.py --v2 hostable.json --packages state/packages.json --emu-ledger state/emu-compat.json \
            --rfm1-ledger saved/compat.json --store pkgs --site hosted --hosting-guard --previous saved/catalog-v2.json > /dev/null
      - name: What needs measuring with the pinned engine
        id: todo
        run: |
          linux=$(python3 pocket/emu/ledger.py todo --ledger state/emu-compat.json --packages state/packages.json --machine linux)
          # a hosted package without its screen picture yet is run again for it (bench.py --shots)
          have=$(gh release view pocket-packages --json assets -q '.assets[].name' 2>/dev/null || true)
          shots=""
          for f in hosted/pkg/*.fwsc; do
            [ -e "$f" ] || continue; n=$(basename "$f" .fwsc)
            if [ "$(sha256sum "$f" | cut -d' ' -f1)" = "$(sha256sum "pkgs/${n%-*}.fwsc" | cut -d' ' -f1)" ]; then
              echo "$have" | grep -qx "shot-$n.png" || shots="$shots ${n%-*}"
            fi
          done
          echo "linux=$(echo $linux $shots | tr ' ' '\n' | sort -u | xargs)" >> "$GITHUB_OUTPUT"
          echo "wasm=$(python3 pocket/emu/ledger.py todo --ledger state/emu-compat.json --packages state/packages.json --machine wasm)" >> "$GITHUB_OUTPUT"
          commit=$(python3 -c "import json;print(json.load(open('pocket/emu/upstream.json'))['commit'][:12])")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          gh release view pocket-packages --json assets -q '.assets[].name' 2>/dev/null | grep -qx "fm1-emu-web-$commit.tar.gz" && echo "web=have" >> "$GITHUB_OUTPUT" || echo "web=build" >> "$GITHUB_OUTPUT"
      - name: Upstream at the pinned commit
        if: steps.todo.outputs.linux != '' || steps.todo.outputs.wasm != '' || steps.todo.outputs.web == 'build'
        run: |
          repo=$(python3 -c "import json;print(json.load(open('pocket/emu/upstream.json'))['repository'])")
          commit=$(python3 -c "import json;print(json.load(open('pocket/emu/upstream.json'))['commit'])")
          git init -q upstream && git -C upstream remote add origin "https://github.com/$repo"
          git -C upstream fetch -q --depth 1 origin "$commit" && git -C upstream checkout -q FETCH_HEAD
      - name: Measure on Linux (upstream's native player)
        if: steps.todo.outputs.linux != ''
        run: |
          sudo apt-get install -y -qq libasound2-dev libx11-dev libxkbcommon-dev libxcursor-dev libxrandr-dev libxi-dev
          (cd upstream && cargo build --release -q -p fm1-live)
          python3 pocket/emu/bench.py --live upstream/target/release/fm1-live --pkgs pkgs --out linux.json --shots shots ${{ steps.todo.outputs.linux }}
          python3 pocket/emu/ledger.py merge --ledger state/emu-compat.json --packages state/packages.json --machine linux --native linux.json
      - name: The browser engine
        if: steps.todo.outputs.wasm != '' || steps.todo.outputs.web == 'build'
        run: |
          rustup target add wasm32-unknown-unknown
          pocket/emu/build-web.sh upstream web-site
          tar -czf "fm1-emu-web-${{ steps.todo.outputs.commit }}.tar.gz" -C web-site/emu .
      - name: Measure in the browser engine (V8)
        if: steps.todo.outputs.wasm != ''
        run: |
          mkdir -p todo && for id in ${{ steps.todo.outputs.wasm }}; do cp "pkgs/$id.fwsc" todo/; done
          pocket/emu/wasm_bench.sh upstream todo wasm.json 1/1 12
          python3 pocket/emu/ledger.py merge --ledger state/emu-compat.json --packages state/packages.json --machine wasm --wasm wasm.json
      - name: Save fetched packages
        if: always()
        uses: actions/cache/save@v6
        with:
          path: pkgs
          key: emu-pkgs-${{ github.run_id }}
      - name: Stage packages, screens, ledger and engine
        run: |
          have=$(gh release view pocket-packages --json assets -q '.assets[].name')
          files="state/packages.json state/emu-compat.json"
          [ -f "fm1-emu-web-${{ steps.todo.outputs.commit }}.tar.gz" ] && files="$files fm1-emu-web-${{ steps.todo.outputs.commit }}.tar.gz"
          for f in hosted/pkg/*.fwsc; do [ -e "$f" ] || continue; echo "$have" | grep -qx "$(basename "$f")" || files="$files $f"; done
          # each hosted package's screen, as shot-<hub>-<sha8>.png
          mkdir -p shotfiles
          for f in hosted/pkg/*.fwsc; do
            [ -e "$f" ] || continue; n=$(basename "$f" .fwsc)
            if [ -f "pkgs/shot-$n.png" ]; then
              cp "pkgs/shot-$n.png" "shotfiles/shot-$n.png"; files="$files shotfiles/shot-$n.png"
            elif [ -f "shots/${n%-*}.png" ] && [ "$(sha256sum "$f" | cut -d' ' -f1)" = "$(sha256sum "pkgs/${n%-*}.fwsc" | cut -d' ' -f1)" ]; then
              cp "shots/${n%-*}.png" "shotfiles/shot-$n.png"; files="$files shotfiles/shot-$n.png"
            fi
          done
          printf '%s\n' $files > package-upload.txt
          python3 -B pocket/hosting_stage.py --files package-upload.txt --stage packages-upload --zip pocket-packages-upload.zip
      - name: Check the finished pocket-packages upload ZIP
        id: package_guard
        run: |
          python3 -B pocket/hosting_guard.py pocket-packages-upload.zip --rfm-catalogue saved/catalog-v2.json --extract-to verified-packages --report packages-delivery-check.json
          echo "passed=true" >> "$GITHUB_OUTPUT"
      - name: Keep only checked packages in pocket-packages
        if: success() && steps.package_guard.outputs.passed == 'true'
        run: |
          gh release view pocket-packages >/dev/null
          have=$(gh release view pocket-packages --json assets -q '.assets[].name')
          gh release upload pocket-packages verified-packages/* --clobber
          # packages (and their screens) no longer hostable or superseded come down
          ls hosted/pkg 2>/dev/null > keep.txt || true
          sed 's/^\(.*\)\.fwsc$/shot-\1.png/' keep.txt > keepshots.txt && cat keepshots.txt >> keep.txt
          echo "$have" | grep -E '\.fwsc$|^shot-.*\.png$' | while read -r name; do grep -qx "$name" keep.txt || gh release delete-asset pocket-packages "$name" -y; done

  # The emulator engine on macOS (Apple Silicon): packages not yet measured there with the pinned engine.
  emu-macos:
    needs: emu
    if: always() && needs.emu.result == 'success'
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write     # emu-compat.json in pocket-packages
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: What needs measuring
        id: todo
        run: |
          mkdir -p state pkgs
          gh release download pocket-packages -p packages.json -p emu-compat.json -D state --clobber
          echo "ids=$(python3 pocket/emu/ledger.py todo --ledger state/emu-compat.json --packages state/packages.json --machine mac)" >> "$GITHUB_OUTPUT"
      - name: Measure on macOS
        if: steps.todo.outputs.ids != ''
        run: |
          ids="${{ steps.todo.outputs.ids }}"
          python3 pocket/emu/fetch.py --packages state/packages.json --dir pkgs --only "${ids// /,}"
          repo=$(python3 -c "import json;print(json.load(open('pocket/emu/upstream.json'))['repository'])")
          commit=$(python3 -c "import json;print(json.load(open('pocket/emu/upstream.json'))['commit'])")
          git init -q upstream && git -C upstream remote add origin "https://github.com/$repo"
          git -C upstream fetch -q --depth 1 origin "$commit" && git -C upstream checkout -q FETCH_HEAD
          (cd upstream && cargo build --release -q -p fm1-live)
          python3 pocket/emu/bench.py --live upstream/target/release/fm1-live --pkgs pkgs --out mac.json $(ls pkgs | sed -n 's/\.fwsc$//p')
          # the ledger may have moved while this ran: merge into the latest copy
          gh release download pocket-packages -p emu-compat.json -D state --clobber
          python3 pocket/emu/ledger.py merge --ledger state/emu-compat.json --packages state/packages.json --machine mac --native mac.json
          gh release upload pocket-packages state/emu-compat.json --clobber

  deploy:
    needs: sync
    if: needs.sync.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
